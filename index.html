<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexical Analyzer</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #9ca3af;
      --accent: #4f46e5;
      --identifier: #fbbf24;
      --number: #22c55e;
      --operator: #60a5fa;
      --semicolon: #f472b6;
      --unknown: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #1f2937, var(--bg) 60%);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    #codeInput {
      width: 100%;
      min-height: 220px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      padding: 14px;
      font-size: 1rem;
      font-family: Consolas, "Courier New", monospace;
      resize: vertical;
      outline: none;
    }

    #codeInput:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #analyzeBtn {
      border: none;
      border-radius: 8px;
      background: linear-gradient(120deg, #4338ca, var(--accent));
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    #analyzeBtn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    #status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #1f2937;
    }

    th {
      color: #cbd5e1;
      background: #111827;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .KEYWORD { color: #fb7185; font-weight: 700; }
    .IDENTIFIER { color: var(--identifier); font-weight: 600; }
    .NUMERIC_CONSTANT { color: var(--number); font-weight: 600; }
    .OPERATOR { color: var(--operator); font-weight: 600; }
    .SPECIAL_CHAR { color: var(--semicolon); font-weight: 600; }
    .UNKNOWN { color: var(--unknown); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lexical Analyzer</h1>
    <p>Type code, click Analyze, and view categorized tokens .</p>

    <textarea id="codeInput" placeholder="Example: x = 5 + 10;"></textarea>

    <div class="actions">
      <button id="analyzeBtn">Analyze</button>
      <span id="status">Server: http://localhost:8080</span>
    </div>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Lexeme</th>
          <th>Token Category</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <tr><td colspan="2">No tokens yet.</td></tr>
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
